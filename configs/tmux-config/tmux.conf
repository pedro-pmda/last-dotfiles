# ~/.config/tmux/tmux.conf — enlazado desde configs/tmux-config/
#
# Fichero único para macOS y Linux. Lo que cambia entre sistemas (el comando de
# portapapeles) no se decide aquí: se delega en clipboard.sh, que lo resuelve en
# cada yank. Antes install-tmux generaba este fichero con `pbcopy` o el wrapper
# horneados dentro, así que el .conf no valía en la otra máquina.

set -g default-terminal "tmux-256color"
set -s escape-time 0
set -g base-index 1

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.config/tmux/clipboard.sh'

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
